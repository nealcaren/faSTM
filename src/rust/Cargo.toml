[package]
name = "faSTM"
publish = false
version = "0.0.0"
edition = "2021"
rust-version = "1.65"

[lib]
crate-type = ["staticlib", "lib"]
name = "faSTM"

# Build-time wrapper generator (run by Makevars: `cargo run --bin document`).
[[bin]]
name = "document"
path = "document.rs"

[dependencies]
extendr-api = "0.7"

# The fitting core: the thin, dependency-light `topica-core` workspace member
# (CTM/STM/SAGE + CVB0; deps = rand/rand_chacha/rayon/regex only). This is what
# makes faSTM CRAN-vendorable — no pyo3/numpy/JVM, no full topica (topica#242).
# Pinned to topica v0.50.0, which carries the STM content-covariate work plus the
# adversarial-review fixes this branch depends on: pure-Laplace l1 (topica#536),
# content_prior_var/content_smooth finiteness guards (topica#531), and the
# spectral projection threshold at stm parity (topica#542, default 10000). The
# thin crate (rand/rand_chacha/rayon/regex; no pyo3/numpy/JVM) is what faSTM
# vendors for CRAN.
topica-core = { git = "https://github.com/nealcaren/topica", tag = "v0.50.0", default-features = false }

# Must match topica's lockfile so the `Rng` trait bound and the seed stream are
# byte-identical to topica's own STM fits (parity).
rand = "0.8"
rand_chacha = "0.3"

# Scoped thread pool for the parallel variational E-step (num_threads control).
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
